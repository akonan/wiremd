<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wiremd Mockup</title>
  <style>

/* wiremd Wireframe Style - Traditional grayscale wireframes */
* {
  box-sizing: border-box;
}

body.wmd-root {
  font-family: Arial, Helvetica, sans-serif;
  background: #f0f0f0;
  color: #000;
  padding: 30px;
  margin: 0;
  line-height: 1.5;
}

/* Headings */
.wmd-h1, .wmd-h2, .wmd-h3, .wmd-h4, .wmd-h5, .wmd-h6 {
  font-weight: bold;
  margin: 1.2em 0 0.6em;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.wmd-h1 { font-size: 2em; }
.wmd-h2 { font-size: 1.75em; }
.wmd-h3 { font-size: 1.5em; }
.wmd-h4 { font-size: 1.25em; }
.wmd-h5 { font-size: 1.1em; }
.wmd-h6 { font-size: 1em; }

/* Paragraph */
.wmd-paragraph {
  margin: 0.6em 0;
}

/* Buttons */
.wmd-button {
  display: inline-block;
  padding: 8px 16px;
  margin: 4px;
  background: repeating-linear-gradient(
    45deg,
    #ddd,
    #ddd 10px,
    #ccc 10px,
    #ccc 20px
  );
  border: 2px solid #000;
  border-radius: 0;
  font-family: inherit;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  cursor: pointer;
}

.wmd-button-primary, .wmd-button.wmd-primary {
  background: repeating-linear-gradient(
    45deg,
    #888,
    #888 10px,
    #777 10px,
    #777 20px
  );
  color: #fff;
}

.wmd-button-secondary, .wmd-button.wmd-secondary {
  background: #fff;
}

.wmd-button-danger, .wmd-button.wmd-danger {
  background: repeating-linear-gradient(
    45deg,
    #666,
    #666 10px,
    #555 10px,
    #555 20px
  );
  color: #fff;
}

.wmd-button[disabled] {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Inputs */
.wmd-input, .wmd-textarea, .wmd-select {
  display: block;
  width: 100%;
  max-width: 400px;
  padding: 6px 10px;
  margin: 4px 0;
  font-family: inherit;
  font-size: 13px;
  background: #fff;
  border: 2px solid #000;
  border-radius: 0;
}

.wmd-input::placeholder, .wmd-textarea::placeholder {
  color: #999;
  font-style: italic;
}

.wmd-input[disabled], .wmd-input.wmd-state-disabled,
.wmd-textarea[disabled], .wmd-textarea.wmd-state-disabled,
.wmd-select[disabled], .wmd-select.wmd-state-disabled {
  opacity: 0.5;
  cursor: not-allowed;
  background: #f0f0f0;
}

.wmd-textarea {
  resize: vertical;
  min-height: 80px;
}

/* Checkboxes and Radios */
.wmd-checkbox, .wmd-radio {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
  cursor: pointer;
}

.wmd-checkbox input[type="checkbox"],
.wmd-radio input[type="radio"] {
  width: 18px;
  height: 18px;
  border: 2px solid #000;
  cursor: pointer;
}

/* Icons */
.wmd-icon {
  display: inline-block;
  font-size: 1em;
  line-height: 1;
  margin: 0 4px;
  vertical-align: middle;
}

/* Containers */
.wmd-container-hero, .wmd-container-card, .wmd-container-modal {
  background: #fff;
  border: 3px solid #000;
  padding: 24px;
  margin: 16px 0;
}

.wmd-container-hero {
  background: repeating-linear-gradient(
    0deg,
    #fafafa,
    #fafafa 2px,
    #fff 2px,
    #fff 4px
  );
  text-align: center;
  padding: 48px 24px;
}

.wmd-container-card {
  max-width: 400px;
}

.wmd-container-modal {
  max-width: 500px;
  margin: 32px auto;
  border-width: 4px;
}

/* Navigation */
.wmd-nav {
  background: repeating-linear-gradient(
    90deg,
    #e0e0e0,
    #e0e0e0 2px,
    #d0d0d0 2px,
    #d0d0d0 4px
  );
  border: 2px solid #000;
  padding: 12px 16px;
  margin: 16px 0;
}

.wmd-nav-content {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.wmd-brand {
  font-weight: bold;
  font-size: 1.1em;
  text-transform: uppercase;
  margin-right: auto;
}

.wmd-nav-item {
  display: inline-block;
  color: #000;
  text-decoration: none;
  font-weight: normal;
  padding: 6px 12px;
  background: #fff;
  border: 1px solid #666;
  border-radius: 3px;
}

.wmd-nav-item:hover {
  background: #f5f5f5;
  border-color: #000;
}

/* Grid */
.wmd-grid {
  display: grid;
  grid-template-columns: repeat(var(--grid-columns, 3), 1fr);
  gap: 20px;
  margin: 20px 0;
}

.wmd-grid-item {
  background: #fff;
  border: 2px solid #000;
  padding: 16px;
}

/* Lists */
.wmd-list {
  margin: 12px 0;
  padding-left: 24px;
}

.wmd-list-item {
  margin: 4px 0;
}

/* Blockquote */
.wmd-blockquote {
  border-left: 4px solid #000;
  padding-left: 16px;
  margin: 16px 0;
  background: #f5f5f5;
  padding: 12px 16px;
}

/* Code */
.wmd-code-inline {
  background: #e0e0e0;
  border: 1px solid #000;
  padding: 2px 6px;
  font-family: 'Courier New', monospace;
  font-size: 0.9em;
}

.wmd-code-block {
  background: #f0f0f0;
  border: 2px solid #000;
  padding: 12px;
  margin: 12px 0;
  overflow-x: auto;
}

.wmd-code-block code {
  font-family: 'Courier New', monospace;
  font-size: 0.9em;
}

/* Separator */
.wmd-separator {
  border: none;
  border-top: 2px solid #000;
  margin: 24px 0;
}

/* State Containers */
.wmd-container-loading-state {
  background: repeating-linear-gradient(
    0deg,
    #fff,
    #fff 2px,
    #f5f5f5 2px,
    #f5f5f5 4px
  );
  border: 2px solid #000;
  padding: 40px;
  margin: 16px 0;
  text-align: center;
  position: relative;
}

.wmd-container-loading-state::before {
  content: '⟳';
  display: block;
  font-size: 48px;
  font-weight: bold;
  margin-bottom: 16px;
  animation: spin 2s linear infinite;
}

.wmd-container-empty-state {
  background: #fff;
  border: 2px dashed #666;
  padding: 60px 40px;
  margin: 16px 0;
  text-align: center;
  color: #666;
}

.wmd-container-empty-state::before {
  content: '[EMPTY]';
  display: block;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 0.2em;
  margin-bottom: 16px;
  color: #999;
}

.wmd-container-error-state {
  background: repeating-linear-gradient(
    45deg,
    #fff,
    #fff 10px,
    #f0f0f0 10px,
    #f0f0f0 20px
  );
  border: 3px solid #000;
  padding: 40px;
  margin: 16px 0;
  text-align: center;
}

.wmd-container-error-state::before {
  content: '⚠';
  display: block;
  font-size: 56px;
  font-weight: bold;
  margin-bottom: 16px;
  color: #000;
}

/* Responsive */
@media (max-width: 768px) {
  .wmd-grid {
    grid-template-columns: 1fr !important;
  }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

  </style>
</head>
<body class="wmd-root wmd-wireframe">
  <h1 class="wmd-h1">Annotations and Comments Demo</h1>
<h2 class="wmd-h2 wmd-annotation="Needs">Hero Section</h2>
<p class="wmd-paragraph">Build wireframes directly from Markdown and keep every change in Git.</p>
<div class="wmd-container-form-group">
  [Get Started]* <!-- Primary CTA -->
  <button class="wmd-button">View Pricing</button>
</div>
<h2 class="wmd-h2">Signup Form</h2>
<div class="wmd-container-form-group">
  Name
  <input type="text" class="wmd-input" style="width: 29ch; max-width: 29ch;" />
</div>
<div class="wmd-container-form-group">
  Work Email
  <input type="email" class="wmd-input" style="width: 29ch; max-width: 29ch;" />
</div>
<p class="wmd-paragraph"><button class="wmd-button wmd-button-primary">Create Account</button> <!-- Validate final button label --></p>
<h2 class="wmd-h2">Release Notes</h2>
<div class="wmd-container-note">
  <p class="wmd-paragraph">This section is pending final review by product marketing.</p>
</div>
<div class="wmd-container-note">
  <p class="wmd-paragraph">Add legal text and privacy consent before publishing.</p>
</div>
</body>
</html>
