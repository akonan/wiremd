<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wiremd Mockup</title>
  <style>

/* Tailwind-Inspired Style */
body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f9fafb;
  color: #111827;
  line-height: 1.5;
  margin: 0;
  padding: 20px;
}

/* Typography */
.wmd-h1 {
  font-size: 2.25rem;
  font-weight: 800;
  color: #111827;
  margin: 0 0 1rem 0;
  letter-spacing: -0.025em;
}

.wmd-h2 {
  font-size: 1.875rem;
  font-weight: 700;
  color: #1f2937;
  margin: 1.5rem 0 1rem 0;
  letter-spacing: -0.025em;
}

.wmd-h3 {
  font-size: 1.5rem;
  font-weight: 600;
  color: #374151;
  margin: 1.25rem 0 0.75rem 0;
}

.wmd-h4 {
  font-size: 1.25rem;
  font-weight: 600;
  color: #4b5563;
  margin: 1rem 0 0.5rem 0;
}

.wmd-paragraph {
  color: #6b7280;
  margin: 0.75rem 0;
  font-size: 1rem;
}

/* Buttons */
.wmd-button {
  padding: 0.5rem 1rem;
  border-radius: 0.5rem;
  font-weight: 500;
  font-size: 0.875rem;
  transition: all 0.15s ease;
  border: none;
  cursor: pointer;
  display: inline-block;
  text-decoration: none;
  background: #e5e7eb;
  color: #374151;
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}

.wmd-button:hover {
  background: #d1d5db;
  transform: translateY(-1px);
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

.wmd-button-primary, .wmd-button.wmd-button-primary {
  background: #6366f1;
  color: white;
}

.wmd-button-primary:hover, .wmd-button.wmd-button-primary:hover {
  background: #4f46e5;
}

.wmd-button:disabled, .wmd-button[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* Button States */
.wmd-state-loading {
  background: #e0e7ff !important;
  color: #6366f1 !important;
  position: relative;
  padding-left: 2.5rem;
}

.wmd-state-loading::before {
  content: '';
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  width: 1rem;
  height: 1rem;
  border: 2px solid #6366f1;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

.wmd-state-error {
  background: #fef2f2 !important;
  color: #ef4444 !important;
  border: 1px solid #fca5a5;
}

.wmd-state-success {
  background: #f0fdf4 !important;
  color: #22c55e !important;
  border: 1px solid #86efac;
}

@keyframes spin {
  to { transform: translateY(-50%) rotate(360deg); }
}

/* Forms */
.wmd-input, .wmd-textarea, .wmd-select {
  width: 100%;
  padding: 0.5rem 0.75rem;
  border: 1px solid #e5e7eb;
  border-radius: 0.5rem;
  font-size: 0.875rem;
  background: white;
  transition: all 0.15s ease;
  color: #111827;
}

.wmd-input:focus, .wmd-textarea:focus, .wmd-select:focus {
  outline: none;
  border-color: #6366f1;
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

.wmd-input::placeholder, .wmd-textarea::placeholder {
  color: #9ca3af;
}

.wmd-input[disabled], .wmd-input.wmd-state-disabled,
.wmd-textarea[disabled], .wmd-textarea.wmd-state-disabled,
.wmd-select[disabled], .wmd-select.wmd-state-disabled {
  opacity: 0.6;
  cursor: not-allowed;
  background: #f9fafb;
  border-color: #e5e7eb;
}

.wmd-textarea {
  resize: vertical;
  min-height: 6rem;
  font-family: inherit;
}

.wmd-select {
  cursor: pointer;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 0.5rem center;
  background-size: 1.5rem;
  padding-right: 2.5rem;
}

/* Checkboxes and Radios */
.wmd-checkbox, .wmd-radio {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin: 0.5rem 0;
  cursor: pointer;
}

.wmd-checkbox input[type="checkbox"],
.wmd-radio input[type="radio"] {
  width: 1rem;
  height: 1rem;
  cursor: pointer;
  accent-color: #6366f1;
}

/* Cards and Containers */
.wmd-container-card {
  background: white;
  border-radius: 0.75rem;
  box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
  padding: 1.5rem;
  margin: 1rem 0;
}

.wmd-container-hero {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-radius: 1rem;
  padding: 3rem 2rem;
  margin: 2rem 0;
  text-align: center;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
}

.wmd-container-hero .wmd-h1,
.wmd-container-hero .wmd-h2,
.wmd-container-hero .wmd-h3,
.wmd-container-hero .wmd-paragraph {
  color: white;
}

.wmd-container-modal {
  background: white;
  border-radius: 1rem;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  padding: 2rem;
  margin: 2rem auto;
  max-width: 600px;
  position: relative;
}

.wmd-container-footer {
  background: #1f2937;
  color: #e5e7eb;
  padding: 2rem;
  margin-top: 3rem;
  border-radius: 0.75rem;
}

.wmd-container-footer .wmd-paragraph,
.wmd-container-footer .wmd-nav-item {
  color: #e5e7eb;
}

.wmd-container-section {
  padding: 1.5rem 0;
  border-bottom: 1px solid #e5e7eb;
}

.wmd-container-section:last-child {
  border-bottom: none;
}

/* Alerts */
.wmd-container-alert {
  padding: 1rem 1.25rem;
  border-radius: 0.5rem;
  margin: 1rem 0;
  border-left: 4px solid;
}

.wmd-container-alert.wmd-warning {
  background: #fef3c7;
  border-left-color: #f59e0b;
  color: #92400e;
}

.wmd-container-alert.wmd-state-error {
  background: #fee2e2;
  border-left-color: #ef4444;
  color: #991b1b;
}

.wmd-container-alert.wmd-state-success {
  background: #d1fae5;
  border-left-color: #10b981;
  color: #065f46;
}

/* Navigation */
.wmd-nav {
  background: white;
  padding: 1rem 1.5rem;
  border-radius: 0.5rem;
  box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
  margin-bottom: 2rem;
}

.wmd-nav-content {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.wmd-nav-item {
  display: inline-block;
  color: #4b5563;
  text-decoration: none;
  padding: 0.5rem 1rem;
  background: #f9fafb;
  border: 1px solid #d1d5db;
  border-radius: 0.375rem;
  transition: all 0.15s ease;
  font-size: 0.875rem;
  font-weight: 500;
}

.wmd-nav-item:hover {
  background: #f3f4f6;
  border-color: #9ca3af;
  color: #111827;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

.wmd-brand {
  font-weight: 700;
  font-size: 1.125rem;
  color: #111827;
  margin-right: auto;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* Lists */
.wmd-list {
  margin: 1rem 0;
  padding: 0;
  list-style: none;
}

.wmd-list-item {
  padding: 0.75rem 0;
  border-bottom: 1px solid #f3f4f6;
  color: #4b5563;
}

.wmd-list-item:last-child {
  border-bottom: none;
}

/* Grid */
.wmd-grid {
  display: grid;
  gap: 1rem;
  margin: 1.5rem 0;
}

.wmd-grid-2 {
  grid-template-columns: repeat(2, 1fr);
}

.wmd-grid-3 {
  grid-template-columns: repeat(3, 1fr);
}

.wmd-grid-4 {
  grid-template-columns: repeat(4, 1fr);
}

/* Tables */
.wmd-table {
  width: 100%;
  background: white;
  border-radius: 0.5rem;
  overflow: hidden;
  box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
  margin: 1rem 0;
  border-collapse: separate;
  border-spacing: 0;
}

.wmd-table th {
  background: #f9fafb;
  padding: 0.75rem 1rem;
  text-align: left;
  font-weight: 600;
  font-size: 0.875rem;
  color: #111827;
  border-bottom: 1px solid #e5e7eb;
}

.wmd-table td {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid #f3f4f6;
  font-size: 0.875rem;
  color: #4b5563;
}

.wmd-table tr:last-child td {
  border-bottom: none;
}

/* Table cell alignment - more specific to override th/td defaults */
.wmd-table .wmd-align-left {
  text-align: left !important;
}

.wmd-table .wmd-align-center {
  text-align: center !important;
}

.wmd-table .wmd-align-right {
  text-align: right !important;
}

/* Icons */
.wmd-icon {
  display: inline-block;
  width: 1.25rem;
  height: 1.25rem;
  vertical-align: middle;
}


/* Utility classes */
.wmd-separator {
  border: none;
  border-top: 1px solid #e5e7eb;
  margin: 2rem 0;
}

.wmd-image {
  max-width: 100%;
  height: auto;
  border-radius: 0.5rem;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

.wmd-code {
  background: #f3f4f6;
  padding: 0.125rem 0.375rem;
  border-radius: 0.25rem;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  font-size: 0.875rem;
  color: #6366f1;
}

.wmd-blockquote {
  border-left: 4px solid #6366f1;
  padding-left: 1rem;
  margin: 1.5rem 0;
  color: #4b5563;
  font-style: italic;
}

/* Button group */
.wmd-container-button-group {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin: 1rem 0;
}

/* Form group */
.wmd-container-form-group {
  margin: 1rem 0;
}

/* State Containers */
.wmd-container-loading-state {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 0.75rem;
  padding: 3rem 2rem;
  margin: 2rem 0;
  text-align: center;
  box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
}

.wmd-container-loading-state::before {
  content: '';
  display: block;
  width: 48px;
  height: 48px;
  margin: 0 auto 1.5rem;
  border: 4px solid #e5e7eb;
  border-top-color: #6366f1;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.wmd-container-empty-state {
  background: #f9fafb;
  border: 2px dashed #d1d5db;
  border-radius: 0.75rem;
  padding: 4rem 2rem;
  margin: 2rem 0;
  text-align: center;
  color: #6b7280;
}

.wmd-container-empty-state::before {
  content: '📭';
  display: block;
  font-size: 4rem;
  margin-bottom: 1.5rem;
  opacity: 0.5;
}

.wmd-container-error-state {
  background: #fef2f2;
  border: 1px solid #fca5a5;
  border-radius: 0.75rem;
  padding: 3rem 2rem;
  margin: 2rem 0;
  text-align: center;
  color: #991b1b;
}

.wmd-container-error-state::before {
  content: '⚠️';
  display: block;
  font-size: 3rem;
  margin-bottom: 1.5rem;
}

/* Responsive */
@media (max-width: 768px) {
  .wmd-grid-2,
  .wmd-grid-3,
  .wmd-grid-4 {
    grid-template-columns: 1fr;
  }

  .wmd-nav-content {
    flex-direction: column;
    align-items: flex-start;
  }

  .wmd-brand {
    margin-right: 0;
    margin-bottom: 0.5rem;
  }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

  </style>
</head>
<body class="wmd-root wmd-tailwind">
  <h1 class="wmd-h1">Annotations and Comments Demo</h1>
<h2 class="wmd-h2 wmd-annotation="Needs">Hero Section</h2>
<p class="wmd-paragraph">Build wireframes directly from Markdown and keep every change in Git.</p>
<div class="wmd-container-form-group">
  [Get Started]* <!-- Primary CTA -->
  <button class="wmd-button">View Pricing</button>
</div>
<h2 class="wmd-h2">Signup Form</h2>
<div class="wmd-container-form-group">
  Name
  <input type="text" class="wmd-input" style="width: 29ch; max-width: 29ch;" />
</div>
<div class="wmd-container-form-group">
  Work Email
  <input type="email" class="wmd-input" style="width: 29ch; max-width: 29ch;" />
</div>
<p class="wmd-paragraph"><button class="wmd-button wmd-button-primary">Create Account</button> <!-- Validate final button label --></p>
<h2 class="wmd-h2">Release Notes</h2>
<div class="wmd-container-note">
  <p class="wmd-paragraph">This section is pending final review by product marketing.</p>
</div>
<div class="wmd-container-note">
  <p class="wmd-paragraph">Add legal text and privacy consent before publishing.</p>
</div>
</body>
</html>
